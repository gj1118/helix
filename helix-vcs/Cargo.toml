[package]
name = "helix-vcs"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
helix-core = { path = "../helix-core" }
helix-event = { path = "../helix-event" }
helix-stdx = { path = "../helix-stdx" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "parking_lot", "macros"] }
parking_lot.workspace = true
arc-swap.workspace = true

gix = { version = "0.85.0", features = ["attributes", "status", "max-performance", "blame", "sha1", "revision"], default-features = false, optional = true }
# gitoxide's copy of imara-diff: 0.2.0 is quadratic on files of few distinct lines
imara-diff = { package = "gix-imara-diff", version = "0.2.3" }
anyhow = "1"

log = "0.4"

[features]
git = ["gix"]

[dev-dependencies]
tempfile.workspace = true
