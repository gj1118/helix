[workspace]
resolver = "2"
members = [
  "helix-core",
  "helix-view",
  "helix-term",
  "helix-tui",
  "helix-lsp-types",
  "helix-lsp",
  "helix-event",
  "helix-dap-types",
  "helix-dap",
  "helix-loader",
  "helix-vcs",
  "helix-parsec",
  "helix-stdx",
  "helix-plugin",
  "xtask",
  "vendor/tree-house",
  "vendor/tree-house-bindings",
]
# third-party crates patched for this fork (see `[patch.crates-io]`)
exclude = ["vendor"]

default-members = [
  "helix-term"
]

[profile.release]
lto = "thin"

[profile.opt]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[profile.integration]
inherits = "test"
package.helix-core.opt-level = 2
package.helix-tui.opt-level = 2
package.helix-term.opt-level = 2

[workspace.dependencies]
tree-house = { version = "0.4", default-features = false }
nucleo = "0.5.0"
slotmap = "1.1.1"
thiserror = "2.0"
tempfile = "3.27.0"
bitflags = "2.12"
unicode-segmentation = "1.13"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
foldhash = "0.2"
parking_lot = "0.12"
futures-executor = "0.3"
futures-util = { version = "0.3", features = ["std", "async-await"], default-features = false }
tokio-stream = "0.1.18"
toml = "1.1"
termina = "0.3"
sonic-rs = "0.5"
globset = "0.4"
etcetera = "0.11"
arc-swap = "1.9"
arrayvec = "0.7"
regex = "1"
once_cell = "1"

# dev dependencies
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
quickcheck = { version = "1", default-features = false }

[workspace.package]
version = "25.7.1"
edition = "2021"
authors = ["Blaž Hrastnik <blaz@mxxn.io>"]
categories = ["editor"]
repository = "https://github.com/helix-editor/helix"
homepage = "https://helix-editor.com"
license = "MPL-2.0"
rust-version = "1.90"

# termina 0.3.3 with its input parser patched: an `Esc ]` or `Esc P` that cannot be a
# terminal's reply is keys again, instead of holding every key after it (see
# vendor/termina/PATCHES.md).
[patch.crates-io]
termina = { path = "vendor/termina" }
# tree-house 0.4.0 (the syntax layer: tree-sitter trees, injections, locals, highlighting) with
# updates that cost what an edit changed instead of the size of the file, and its bindings to
# tree-sitter with predicates fixed for text spanning chunks of the rope (see the PATCHES.md of
# vendor/tree-house and vendor/tree-house-bindings).
tree-house = { path = "vendor/tree-house" }
tree-house-bindings = { path = "vendor/tree-house-bindings" }
