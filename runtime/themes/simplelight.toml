# simplelight: the light twin of simpledark, on a soft grey background. The greys keep
# simpledark's order and spacing of contrast.
# Syntax is told apart by shade and by bold / italic rather than by hue.

# Syntax highlighting
"attribute" = "gray-7"
"type" = { fg = "dark-1" }
"type.builtin" = { fg = "dark-1", modifiers = ["italic"] }
"type.parameter" = { fg = "dark-0", modifiers = ["italic"] }
"type.enum.variant" = "dark-0"
"constructor" = "dark-1"
"constant" = "gray-9"
"constant.builtin" = { fg = "gray-9", modifiers = ["italic"] }
"constant.character.escape" = "dark-2"
"constant.numeric" = "gray-8"
"string" = "gray-6"
"string.regexp" = "gray-7"
"string.special" = "gray-8"
"comment" = { fg = "gray-5", modifiers = ["italic"] }
"comment.block.documentation" = { fg = "gray-6", modifiers = ["italic"] }
"variable" = "fg"
"variable.builtin" = { fg = "dark-0", modifiers = ["italic"] }
"variable.parameter" = "dark-0"
"variable.other.member" = "gray-9"
"label" = "gray-7"
"punctuation" = "gray-6"
"punctuation.bracket" = "gray-8"
"punctuation.special" = "gray-7"
"keyword" = { fg = "ink", modifiers = ["bold"] }
"keyword.control" = { fg = "ink", modifiers = ["bold"] }
"keyword.directive" = "dark-2"
"keyword.storage.modifier" = "dark-2"
"operator" = "gray-7"
"function" = "dark-2"
"function.builtin" = { fg = "dark-2", modifiers = ["italic"] }
"function.macro" = { fg = "dark-0", modifiers = ["bold"] }
"tag" = "dark-1"
"tag.attribute" = "gray-7"
"namespace" = "gray-8"
"special" = "dark-2"

"markup.heading" = { fg = "ink", modifiers = ["bold"] }
"markup.heading.marker" = "gray-4"
"markup.list" = "gray-7"
"markup.list.checked" = "gray-6"
"markup.list.unchecked" = "gray-4"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "gray-7", underline = { style = "line" } }
"markup.link.text" = "dark-2"
"markup.link.label" = "dark-1"
"markup.quote" = { fg = "gray-6", modifiers = ["italic"] }
"markup.raw" = "gray-8"

"diff.plus" = "gray-8"
"diff.minus" = "gray-2"
"diff.delta" = "gray-6"
"diff.delta.moved" = "gray-5"
"diff.delta.conflict" = { fg = "ink", modifiers = ["bold"] }

# Interface
"ui.background" = { bg = "bg" }
"ui.background.separator" = "bg-3"
"ui.text" = "fg"
"ui.text.focus" = { fg = "ink", bg = "bg-2", modifiers = ["bold"] }
"ui.text.inactive" = "gray-3"
"ui.text.info" = "fg"
"ui.text.directory" = "dark-2"
"ui.text.symlink" = { fg = "gray-7", modifiers = ["italic"] }

"ui.cursor" = { fg = "gray-3", bg = "dark-1" }
"ui.cursor.primary" = { fg = "bg", bg = "dark-1" }
"ui.cursor.select" = { fg = "bg", bg = "gray-7" }
"ui.cursor.insert" = { fg = "bg", bg = "ink" }
"ui.cursor.match" = { fg = "ink", bg = "bg-3", modifiers = ["bold"] }
"ui.cursorline.primary" = { bg = "bg-1" }
"ui.cursorline.secondary" = { bg = "bg-1" }
"ui.cursorcolumn.primary" = { bg = "bg-1" }
"ui.selection" = { bg = "bg-3" }
"ui.selection.primary" = { bg = "bg-4" }
"ui.highlight" = { bg = "bg-2" }
"ui.highlight.frameline" = { bg = "bg-3" }

"ui.gutter" = { bg = "bg" }
"ui.gutter.selected" = { bg = "bg-1" }
"ui.linenr" = "gray-6"
"ui.linenr.selected" = { fg = "dark-1", modifiers = ["bold"] }
"ui.debug.breakpoint" = "ink"
"ui.debug.active" = "dark-1"

"ui.statusline" = { fg = "gray-9", bg = "bg-2" }
"ui.statusline.inactive" = { fg = "gray-3", bg = "bg-1" }
"ui.statusline.normal" = { fg = "bg", bg = "dark-1", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg", bg = "ink", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg", bg = "gray-6", modifiers = ["bold"] }
"ui.statusline.separator" = "gray-2"
"ui.bufferline" = { fg = "gray-4", bg = "bg-1" }
"ui.bufferline.active" = { fg = "ink", bg = "bg-3", modifiers = ["bold"] }
"ui.bufferline.background" = { bg = "bg-1" }
"ui.breadcrumb" = "gray-6"
"ui.breadcrumb.separator" = "gray-2"

"ui.window" = "bg-3"
"ui.popup" = { fg = "fg", bg = "bg-1" }
"ui.popup.info" = { fg = "fg", bg = "bg-1" }
"ui.popup.title" = { fg = "ink", modifiers = ["bold"] }
"ui.popup.border" = "gray-1"
"ui.help" = { fg = "fg", bg = "bg-1" }
"ui.menu" = { fg = "fg", bg = "bg-1" }
"ui.menu.selected" = { fg = "bg", bg = "dark-1" }
"ui.menu.scroll" = { fg = "gray-4", bg = "bg-2" }
"ui.picker.header" = { bg = "bg-1" }
"ui.picker.header.column" = "gray-6"
"ui.picker.header.column.active" = { fg = "ink", modifiers = ["bold", "underlined"] }

"ui.explorer.border" = "bg-3"
"ui.explorer.tree" = "bg-4"
"ui.explorer.tree.selected" = "gray-4"
"ui.explorer.path" = { bg = "bg-2" }

"ui.virtual" = "bg-4"
"ui.virtual.ruler" = { bg = "bg-1" }
"ui.virtual.whitespace" = "bg-3"
"ui.virtual.indent-guide" = "bg-3"
"ui.virtual.wrap" = "gray-4"
"ui.virtual.inlay-hint" = { fg = "gray-2", modifiers = ["italic"] }
"ui.virtual.inline-value" = { fg = "gray-4", modifiers = ["italic"] }
"ui.virtual.code-lens" = { fg = "gray-3", modifiers = ["italic"] }
"ui.virtual.inline-blame" = { fg = "gray-1", modifiers = ["italic"] }
"ui.virtual.inline-completion" = { fg = "gray-2", modifiers = ["italic"] }
"ui.virtual.fold-decoration" = { fg = "gray-4", bg = "bg-2" }
"ui.virtual.jump-label" = { fg = "ink", bg = "bg-3", modifiers = ["bold"] }

# Diagnostics: brighter (and bolder) the more serious, with distinct underlines
"error" = { fg = "ink", modifiers = ["bold"] }
"warning" = "dark-2"
"info" = "gray-7"
"hint" = "gray-4"
"diagnostic.error" = { underline = { color = "ink", style = "curl" } }
"diagnostic.warning" = { underline = { color = "dark-0", style = "curl" } }
"diagnostic.info" = { underline = { color = "gray-6", style = "dotted" } }
"diagnostic.hint" = { underline = { color = "gray-4", style = "dotted" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

# Comment annotations (TODO:, FIXME:, …): stand out against the surrounding comment
# Aliases share a key: TO-DO -> todo, FIXIT -> fix, PERFORMANCE -> perf, MARKER/BOOKMARK -> mark, MOCK -> stub.
"error.broken" = { fg = "ink", modifiers = ["bold"] }
"error.bug" = { fg = "ink", modifiers = ["bold"] }
"error.compliance" = { fg = "ink", modifiers = ["bold"] }
"error.debug" = { fg = "ink", modifiers = ["bold"] }
"error.fail" = { fg = "ink", modifiers = ["bold"] }
"error.fix" = { fg = "ink", modifiers = ["bold"] }
"error.fixme" = { fg = "ink", modifiers = ["bold"] }
"error.invariant" = { fg = "ink", modifiers = ["bold"] }
"error.issue" = { fg = "ink", modifiers = ["bold"] }
"error.panic" = { fg = "ink", modifiers = ["bold"] }
"error.safety" = { fg = "ink", modifiers = ["bold"] }
"error.security" = { fg = "ink", modifiers = ["bold"] }
"error.xxx" = { fg = "ink", modifiers = ["bold"] }
"warning.hack" = { fg = "dark-2", modifiers = ["bold"] }
"warning.temp" = { fg = "dark-2", modifiers = ["bold"] }
"warning.test" = { fg = "dark-2", modifiers = ["bold"] }
"warning.untested" = { fg = "dark-2", modifiers = ["bold"] }
"warning.warn" = { fg = "dark-2", modifiers = ["bold"] }
"info.info" = { fg = "gray-7", modifiers = ["bold"] }
"info.note" = { fg = "gray-7", modifiers = ["bold"] }
"info.optimize" = { fg = "gray-7", modifiers = ["bold"] }
"info.perf" = { fg = "gray-7", modifiers = ["bold"] }
"info.question" = { fg = "gray-7", modifiers = ["bold"] }
"info.refactor" = { fg = "gray-7", modifiers = ["bold"] }
"info.review" = { fg = "gray-7", modifiers = ["bold"] }
"info.todo" = { fg = "gray-7", modifiers = ["bold"] }
"info.undone" = { fg = "gray-7", modifiers = ["bold"] }
"hint.done" = { fg = "gray-4", modifiers = ["bold"] }
"hint.hint" = { fg = "gray-4", modifiers = ["bold"] }
"hint.mark" = { fg = "gray-4", modifiers = ["bold"] }
"hint.passed" = { fg = "gray-4", modifiers = ["bold"] }
"hint.stub" = { fg = "gray-4", modifiers = ["bold"] }
"hint.tip" = { fg = "gray-4", modifiers = ["bold"] }

"tabstop" = { bg = "bg-3", modifiers = ["italic"] }

rainbow = ["ink", "gray-8", "gray-6", "dark-1", "gray-7", "gray-5"]

[palette]
# Backgrounds: the page, then darker steps for the cursor line, bars, selections and guides
bg = "#b6b8b3"
bg-1 = "#adafaa"
bg-2 = "#a4a6a1"
bg-3 = "#979994"
bg-4 = "#868883"
# Greys, faintest to strongest
gray-1 = "#6d6e6b"
gray-2 = "#686966"
gray-3 = "#636461"
gray-4 = "#5a5b58"
gray-5 = "#565754"
gray-6 = "#40413e"
gray-7 = "#3c3d3a"
gray-8 = "#2e2f2c"
gray-9 = "#2a2b28"
# Text, then the darkest inks for cursors, keywords and headings
fg = "#232421"
dark-1 = "#242522"
dark-0 = "#1f201d"
dark-2 = "#080906"
ink = "#000100"
